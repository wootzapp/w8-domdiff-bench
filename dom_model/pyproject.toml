[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "benchmark-dom-model"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.0",
  "azure-identity>=1.16",
  "httpx>=0.27",
  "tiktoken>=0.7",
  "Pillow>=10",
  "pydantic>=2",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
dom-model-verify-trajectories = "dom_model.runner:main"

[tool.setuptools.package-data]
dom_model = ["resources/*.md"]
