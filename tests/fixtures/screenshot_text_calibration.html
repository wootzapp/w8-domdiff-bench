<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Screenshot text calibration</title>
<style>
html, body { margin: 0; min-height: 100%; background: white; color: black; }
body { font-family: Arial, sans-serif; }
h1 { margin: 48px 64px 32px; font-size: 22px; }
.row { display: flex; align-items: baseline; gap: 28px; margin: 30px 64px; }
.label { width: 70px; font-size: 16px; }
.value { font-family: Arial, sans-serif; letter-spacing: 0; }
</style>
<h1>Text size</h1>
<div class="row"><span class="label">8 px</span><span class="value" data-size="8" style="font-size:8px">J7M4Q2R9</span></div>
<div class="row"><span class="label">10 px</span><span class="value" data-size="10" style="font-size:10px">V3K8T5N6</span></div>
<div class="row"><span class="label">12 px</span><span class="value" data-size="12" style="font-size:12px">P9D2W7X4</span></div>
<div class="row"><span class="label">14 px</span><span class="value" data-size="14" style="font-size:14px">F6C1Y8H3</span></div>
</html>
