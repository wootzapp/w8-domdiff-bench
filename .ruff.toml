target-version = "py312"
line-length = 100
extend-exclude = [
  ".venv",
  "data",
  "results",
  "**/*.egg-info",
]

[lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[lint.per-file-ignores]
# These are deliberate legacy-layout compatibility points in the byte-preserving
# standalone verifier copies, not unresolved runtime errors.
"**/rubric_agent.py" = ["E402"]
"microsoft_verifier/src/microsoft_verifier/clients/__init__.py" = ["F403"]
"microsoft_verifier/src/microsoft_verifier/trajectory.py" = ["E741"]
